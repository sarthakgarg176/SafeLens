<!DOCTYPE html>
<html>
<head>
  <title>SafeLens E2E Interception Test Page</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 20px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }
    .upload-area {
      border: 2px dashed #38bdf8;
      border-radius: 8px;
      padding: 40px 20px;
      margin: 20px 0;
      cursor: pointer;
      background: #0f172a;
      transition: background 0.3s;
    }
    .upload-area:hover {
      background: #1e293b;
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0ea5e9;
    }
    .file-info {
      margin-top: 15px;
      font-size: 13px;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SafeLens Test Portal</h1>
    <p>Use this page to verify the upload interception pipeline, visual redaction, watermark, and backend logging flow.</p>
    
    <div class="upload-area" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <span style="color: #94a3b8">Drag and drop an image here or click to select</span>
      <input type="file" id="fileInput" name="file" accept="image/*" />
    </div>
    
    <button class="btn" onclick="document.getElementById('fileInput').click()">Select File</button>
    <div class="file-info" id="fileInfo"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const dropzone = document.getElementById('dropzone');

    fileInput.addEventListener('change', (e) => {
      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        fileInfo.textContent = `Intercepted file approved for upload: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
        console.log('[SafeLens Test Page] Received file from input upload event:', file);
      }
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        fileInput.files = e.dataTransfer.files;
        const event = new Event('change');
        fileInput.dispatchEvent(event);
      }
    });
  </script>
</body>
</html>
